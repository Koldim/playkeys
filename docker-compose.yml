services:
  db:
    image: postgres:16-alpine
    container_name: digital-store-db
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: digital_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d digital_store"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
